name: ci

on:
  push:
    branches-ignore: [data]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[bot,dev]"
      - run: ruff check hungrybear tests
      - run: ruff format --check hungrybear tests
      - run: pytest -q

