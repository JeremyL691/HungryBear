[project]
name = "hungrybear"
version = "2.0.0"
description = "UC dining menus for all 9 undergraduate campuses: daily collector, public JSON API, Telegram bot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
bot = ["python-telegram-bot[job-queue]>=22.5", "python-dotenv>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hungrybear*"]

[tool.setuptools.package-data]
hungrybear = ["campuses.yaml", "certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:The .strip_cdata. option:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007", "UP006", "UP035", "UP045"]
