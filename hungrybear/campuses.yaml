# One entry per campus.
#
#   adapter:            module in hungrybear/adapters/
#   main_halls:         location ids that must serve full meals on a normal day
#   weekday_only:       main halls that normally close on weekends
#   min_items_per_meal: a main-hall meal with fewer items than this is flagged "broken"
#   breaks:             [start, end] inclusive date ranges with no service (suppresses alerts)
#   options:            adapter-specific settings

ucb:
  name: UC Berkeley
  short_name: Berkeley
  adapter: berkeley
  main_halls: [cafe-3, clark-kerr, crossroads, foothill]
  min_items_per_meal: 10
  breaks:
    - [2026-11-26, 2026-11-29]   # Thanksgiving
    - [2026-12-19, 2027-01-10]   # Winter break (approx.; confirm on Important Dates page)
  options:
    location_types:
      bear-market: market
      cub-market: market
      den: market
      golden-bear-cafe: cafe
      eateries-at-student-union: restaurant
      browns: cafe
      local-x-design: cafe
      qualcomm-cafe: cafe
      gateway-cafe: cafe

ucla:
  name: UCLA
  short_name: UCLA
  adapter: ucla
  main_halls: [de-neve-dining, sproul-dining]
  min_items_per_meal: 10
  options:
    # menus-at-a-glance name -> /hours/ name
    hours_aliases:
      Sproul Dining: Bruin Plate
      Covel Dining: Epicuria at Covel

ucsb:
  name: UC Santa Barbara
  short_name: UCSB
  adapter: ucsb
  main_halls: [carrillo, de-la-guerra, portola]
  min_items_per_meal: 8

ucsc:
  name: UC Santa Cruz
  short_name: UCSC
  adapter: foodpro
  main_halls:
    - john-r-lewis-and-college-nine-di
    - cowell-and-stevenson-dining-hall
    - crown-and-merrill-dining-hall
    - porter-and-kresge-dining-hall
    - rachel-carson-and-oakes-dining-h
  weekday_only: [crown-and-merrill-dining-hall, porter-and-kresge-dining-hall]
  min_items_per_meal: 8
  options:
    base: https://nutrition.sa.ucsc.edu/
    index: ""

ucr:
  name: UC Riverside
  short_name: UCR
  adapter: foodpro
  main_halls: [glasgow, lothian]
  weekday_only: [lothian]
  min_items_per_meal: 8
  options:
    base: https://foodpro.ucr.edu/foodpro/
    index: location.aspx

ucsd:
  name: UC San Diego
  short_name: UCSD
  adapter: ucsd
  main_halls: [64-degrees, canyon-vista-marketplace, foodworx, oceanview, pines, ventanas]
  weekday_only: [foodworx, oceanview]
  min_items_per_meal: 10
  options:
    location_types:
      bistro: restaurant
      cecils-at-faculty-club: restaurant
      club-med: cafe

ucd:
  name: UC Davis
  short_name: Davis
  adapter: davis
  main_halls: [segundo, tercero, cuarto]
  weekday_only: [tercero, cuarto]
  min_items_per_meal: 8

uci:
  name: UC Irvine
  short_name: UCI
  adapter: mydininghub
  main_halls: [anteatery, brandywine]
  min_items_per_meal: 10
  options:
    store: ch_uci_en
    campus_url_key: campus
    location_types:
      halal-shack-west-food-court: restaurant

ucm:
  name: UC Merced
  short_name: Merced
  adapter: bigzpoon
  main_halls: [pavilion]
  min_items_per_meal: 3   # cycle menu lists composed plates, not individual dishes
  options:
    company_id: 61bd7ecd8c760e0011ac0fac
    # from the "Dining Center Menus" links on dining.ucmerced.edu (location_no 12443 / 12462)
    locations:
      - {id: 61df4a34d5507a00103ee41e, name: Pavilion}
      - {id: 628672b52903a50010fa751e, name: YWDC}
