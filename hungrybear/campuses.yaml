# One entry per campus.
#
#   adapter:              module in hungrybear/adapters/
#   main_halls:           location ids that must serve full meals on a normal day
#   weekday_only:         main halls that normally close on weekends
#   min_items_per_meal:   a main-hall meal with fewer items than this is flagged "broken"
#   holidays:             FreshCal holiday calendars (country/subdivision codes, e.g. US-CA)
#   calendar_valid_until: academic-calendar review horizon (FreshCal warns ahead of expiry)
#   breaks:               inclusive academic break windows ({start, end, name} or [start, end])
#   options:              adapter-specific settings
#   runner:               ci (default) or local; the collector currently runs everything from one host

ucb:
  name: UC Berkeley
  short_name: Berkeley
  adapter: berkeley
  main_halls: [cafe-3, clark-kerr, crossroads, foothill]
  min_items_per_meal: 10
  holidays: [US-CA]
  calendar_valid_until: 2027-06-30
  breaks:
    - {start: 2026-11-25, end: 2026-11-29, name: Thanksgiving break}   # incl. Wed reduced service & Sun reopen
    - {start: 2026-12-19, end: 2027-01-18, name: Winter break}         # semester: Fall finals end Dec 18; Spring instruction Jan 19
    - {start: 2027-03-20, end: 2027-03-28, name: Spring break}
  options:
    location_types:
      bear-market: market
      cub-market: market
      den: market
      golden-bear-cafe: cafe
      eateries-at-student-union: restaurant
      browns: cafe
      local-x-design: cafe
      qualcomm-cafe: cafe
      gateway-cafe: cafe

